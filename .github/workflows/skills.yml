name: Skill bundle conformance

on:
  push:
    branches: [main]
    paths: ['.agents/**', 'scripts/check_skills.py', 'tests/**', 'requirements-dev.txt', '.github/workflows/skills.yml']
  workflow_dispatch:
    inputs:
      cli_version:
        description: Exact existing public CLI release to check (not latest)
        required: true
        default: '1.0.24'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/check_skills.py
      - name: Download exact public CLI and verify checksum
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_VERSION: ${{ inputs.cli_version || '1.0.24' }}
        run: |
          set -euo pipefail
          [[ "$CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          mkdir cli-check
          gh release download "$CLI_VERSION" --repo Heeler-Security/heelercli --pattern heelercli-linux-amd64.tgz --pattern heelercli-linux-amd64.tgz.sha256 --dir cli-check
          cd cli-check
          sha256sum --check heelercli-linux-amd64.tgz.sha256
          tar -xzf heelercli-linux-amd64.tgz heelercli
      - name: Check skill commands against that CLI release
        env:
          CLI_VERSION: ${{ inputs.cli_version || '1.0.24' }}
        run: |
          python scripts/check_skills.py --cli ./cli-check/heelercli --expected-version "$CLI_VERSION" > skill-conformance.json
          git rev-parse HEAD > skill-source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: skill-conformance-${{ github.sha }}
          path: |
            .agents/skills.json
            skill-conformance.json
            skill-source-commit.txt
          include-hidden-files: true
          if-no-files-found: error
